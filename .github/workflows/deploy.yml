name: Testes e publicação

# Em qualquer push ou PR: verifica o código, roda os testes e gera o build.
# Na branch main (ou manualmente): publica no GitHub Pages, só se tudo passar.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar o código (ESLint)
        run: npm run lint

      - name: Testes das regras de negócio
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Enviar artefato do site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    # Fluxos completos no navegador (computador e celular), responsividade e offline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      # Sem o Firebase: os testes de tela não usam o projeto real (a nuvem é testada no job "cloud").
      - name: Build de produção (sem nuvem)
        run: npm run build:e2e

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      - name: Capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: tests/e2e/output
          if-no-files-found: ignore

  cloud:
    # Sincronização entre aparelhos e regras do Firestore, nos emuladores do Firebase.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Testes da nuvem e do login (emuladores)
        run: npm run test:cloud

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, e2e, cloud]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
