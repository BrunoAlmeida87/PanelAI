name: Testes e publicação

# Em qualquer push ou PR: instala, testa e gera o build.
# Na branch main (ou manualmente): publica no GitHub Pages.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes das regras de negócio
        run: npm test

      - name: Build de produção
        run: npm run build
        env:
          # Opcional: servidor de sincronização já preenchido no site publicado.
          # Defina em Settings → Secrets and variables → Actions → Variables.
          VITE_SYNC_URL: ${{ vars.PANELAI_SYNC_URL }}
          VITE_SYNC_KEY: ${{ vars.PANELAI_SYNC_KEY }}

      - name: Enviar artefato do site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
