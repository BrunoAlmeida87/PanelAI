# PanelAI — programa da tela e-ink no kit TRMNL 7,5" (OG) DIY da Seeed
# (XIAO ESP32-S3 Plus + XIAO ePaper Display Board + tela 7,5", 800 × 480, preto e branco).
#
# Substitui o programa do TRMNL (que depende do serviço pago deles). O aparelho
# passa quase o tempo todo em sono profundo e acorda:
#   - nos horários de PanelAI → Configurações → Tela e-ink: baixa a imagem da
#     tela pela internet, mostra e volta a dormir;
#   - no meio do caminho, a cada no máximo 6 horas, só para acertar o relógio e
#     reler os horários (a tela não pisca);
#   - quando alguém aperta o botão (o mesmo que acordava o TRMNL): atualiza na hora.
#     Segurando o botão por 5 segundos, entra no modo de configuração.
# A imagem (tela.png) e os horários (config.json) são publicados pelo GitHub no
# endereço secreto da casa. Passo a passo: docs/DISPLAY.md.
#
# Este arquivo NÃO tem segredos e pode ser compilado por qualquer um:
#   - o Wi-Fi é informado na instalação pelo navegador (Improv) ou na rede
#     "PanelAI-Tela" que o aparelho cria no modo de configuração;
#   - o endereço da imagem é colado na página do próprio aparelho
#     (campo "Endereço da imagem") e fica guardado nele.
# O firmware pronto é publicado pelo CI (.github/workflows/esphome.yml) e
# instalado pela página <site>/instalar-tela.html.
#
# As regras de quando dormir ficam em panelai_tela.h (testadas com g++).

substitutions:
  # Posição da tela: 0 = deitada. Para um layout "Em pé", use 90 ou 270.
  rotacao: "0"
  # Rede que o aparelho cria no modo de configuração (aparece também na tela).
  rede_config: PanelAI-Tela
  senha_config: panelai123

esphome:
  name: panelai-tela
  friendly_name: PanelAI Tela
  min_version: 2026.7.0
  project:
    name: panelai.tela
    version: "1.4.0"
  includes:
    - panelai_tela.h
  on_boot:
    - priority: 600
      then:
        # Liga o circuito que mede a bateria (GPIO6).
        - output.turn_on: bateria_medir
    - priority: -100
      then:
        - script.execute: vigia
        - script.execute: acordar

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

wifi:
  # Nenhuma rede gravada aqui: ela vem da instalação (Improv) ou do modo de configuração.
  ap:
    ssid: ${rede_config}
    password: ${senha_config}
  # Sem rede, não reinicia: dorme e tenta de novo mais tarde (economiza bateria).
  reboot_timeout: 0s

# Página para escolher o Wi-Fi quando o aparelho cria a rede "PanelAI-Tela".
captive_portal:

# Wi-Fi pelo cabo USB, logo depois da instalação pelo navegador.
improv_serial:

# Página do aparelho (http://<ip>): endereço da imagem, situação, bateria e "Atualizar agora".
web_server:
  port: 80
  version: 3
  # Funciona também sem internet (na rede "PanelAI-Tela").
  local: true

time:
  - platform: sntp
    id: relogio
    # Só para os registros (logs): os horários chegam prontos, em UTC, no config.json.
    timezone: America/Sao_Paulo

http_request:
  verify_ssl: true
  timeout: 20s
  follow_redirects: true
  useragent: PanelAI-Tela/1.4

globals:
  # Próximas atualizações (segundos UTC), lidas do config.json. Guardadas para
  # o aparelho seguir a agenda mesmo se ficar um tempo sem internet.
  # (Mesmo tipo que panelai::Agenda; escrito por extenso porque as variáveis
  # globais são declaradas antes de panelai_tela.h ser incluído.)
  - id: proximas
    type: std::array<uint32_t, 24>
    restore_value: true
    # Tipo explícito: só "{}" fica ambíguo para o compilador.
    initial_value: "std::array<uint32_t, 24>{}"
  # Horário que o aparelho estava esperando quando foi dormir (0 = nenhum).
  - id: alvo
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # Falhas seguidas (sem Wi-Fi, sem imagem): espera cada vez mais entre as tentativas.
  - id: falhas
    type: uint8_t
    restore_value: true
    initial_value: "0"
  # Nesta vez acordado: baixa a imagem e redesenha a tela?
  - id: atualizar_tela
    type: bool
    initial_value: "false"
  # Acordou pelo relógio (e não pelo botão ou por ter sido ligado)?
  - id: pelo_relogio
    type: bool
    initial_value: "false"
  # Modo de configuração: fica acordado, mostra as instruções e cria a rede "PanelAI-Tela".
  - id: modo_config
    type: bool
    initial_value: "false"
  # Por que entrou no modo de configuração: 0 = sem endereço, 1 = sem Wi-Fi, 2 = botão.
  - id: motivo_config
    type: uint8_t
    initial_value: "0"
  # Quanto tempo dormir (ms), calculado pelo script "dormir".
  - id: soneca_ms
    type: uint32_t
    initial_value: "1800000"

text:
  # O endereço de Configurações → Tela e-ink, colado na página do aparelho.
  - platform: template
    id: endereco
    name: "Endereço da imagem"
    icon: mdi:link-variant
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 200
    on_value:
      then:
        - script.execute: endereco_mudou

button:
  - platform: template
    name: "Atualizar a tela agora"
    icon: mdi:refresh
    on_press:
      then:
        - script.execute: sair_da_configuracao

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip
      name: "Endereço IP"
  - platform: template
    id: situacao
    name: "Situação"
    icon: mdi:information-outline

output:
  - platform: gpio
    pin: GPIO6
    id: bateria_medir

sensor:
  - platform: adc
    pin: GPIO1
    id: bateria
    name: "Bateria"
    attenuation: 12db
    update_interval: 2s
    accuracy_decimals: 2
    filters:
      - multiply: 2.0 # divisor de tensão da placa

binary_sensor:
  # O botão que acordava o TRMNL (D4 / GPIO5). Segurar 5 s: modo de configuração.
  - platform: gpio
    id: botao
    name: "Botão"
    pin:
      number: GPIO5
      inverted: true
      mode:
        input: true
        pullup: true
      allow_other_uses: true
    on_press:
      then:
        - delay: 5s
        - if:
            condition:
              binary_sensor.is_on: botao
            then:
              - lambda: "id(motivo_config) = 2;"
              - script.execute: configurar

deep_sleep:
  id: sono
  # O mesmo botão acorda o aparelho (apertado = nível baixo).
  wakeup_pin:
    number: GPIO5
    inverted: true
    mode:
      input: true
      pullup: true
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

image:
  - platform: online_image
    id: tela_img
    # Trocado antes de cada download pelo endereço guardado no aparelho.
    url: https://brunoalmeida87.github.io/PanelAI/
    format: PNG
    type: BINARY
    update_interval: never
    on_download_finished:
      then:
        - logger.log: "Imagem baixada; desenhando a tela"
        - text_sensor.template.publish:
            id: situacao
            state: "Tela atualizada"
        - component.update: epaper
        - wait_until:
            condition:
              lambda: "return !id(epaper).is_updating();"
            timeout: 40s
        - script.execute:
            id: dormir
            falhou: false
    on_error:
      then:
        - logger.log:
            level: WARN
            format: "Não foi possível baixar a imagem"
        - text_sensor.template.publish:
            id: situacao
            state: "Não foi possível baixar a imagem (confira o endereço)"
        - script.execute:
            id: dormir
            falhou: true

font:
  # Letras com acento do português (GF_Latin_Core). A Inter não tem um sinal
  # combinante raro desse conjunto; ele não é usado nos textos.
  - file: "gfonts://Inter@700"
    id: fonte_titulo
    size: 34
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@500"
    id: fonte_texto
    size: 23
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true

display:
  # Tela de 7,5" (UC8179, igual à Waveshare 7,5" V2), ligada na placa XIAO ePaper.
  - platform: epaper_spi
    id: epaper
    model: waveshare-7.5in-v2
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    rotation: ${rotacao}
    update_interval: never
    lambda: |-
      if (id(modo_config)) {
        // Instruções do modo de configuração.
        it.fill(Color::WHITE);
        const auto preto = Color::BLACK;
        it.print(32, 28, id(fonte_titulo), preto, "PanelAI · configurar a tela");
        it.filled_rectangle(32, 78, it.get_width() - 64, 3, preto);
        int y = 100;
        auto linha = [&](const std::string &t) {
          it.print(32, y, id(fonte_texto), preto, t.c_str());
          y += 36;
        };
        // (Nome diferente do sensor "ip": id(ip) dentro de "const auto ip = …" pegaria a própria variável.)
        const std::string endereco_ip = id(ip).state;
        const bool com_wifi = !endereco_ip.empty() && endereco_ip != "0.0.0.0";
        if (com_wifi) {
          linha("1. No celular ou no computador (mesma rede Wi-Fi), abra:");
          linha("      http://" + endereco_ip);
        } else {
          linha("1. No celular, conecte-se à rede Wi-Fi \"${rede_config}\"");
          linha("    (senha: ${senha_config}) e escolha a rede da casa.");
        }
        linha("2. Em \"Endereço da imagem\", cole o endereço de");
        linha("    PanelAI → Configurações → Tela e-ink.");
        linha("3. Pronto: a tela mostra o PanelAI e passa a seguir os horários.");
        y += 12;
        const bool tem_endereco = panelai::endereco_valido(id(endereco).state);
        linha(tem_endereco ? "Endereço da imagem: configurado" : "Endereço da imagem: ainda não configurado");
        linha("Este modo termina sozinho em 15 minutos.");
        return;
      }
      it.image(0, 0, id(tela_img));
      // Bateria fraca (abaixo de ~20%): ícone pequeno no canto de baixo, à direita.
      const float v = id(bateria).state;
      if (!std::isnan(v) && v > 2.5f && v < 3.5f) {
        const int x = it.get_width() - 46, y = it.get_height() - 24;
        it.filled_rectangle(x - 4, y - 4, 48, 24, Color::WHITE);
        it.rectangle(x, y, 34, 16, Color::BLACK);
        it.filled_rectangle(x + 34, y + 5, 3, 6, Color::BLACK);
        const int nivel = std::max(1, (int) ((v - 3.27f) / (3.5f - 3.27f) * 6));
        it.filled_rectangle(x + 2, y + 2, nivel, 12, Color::BLACK);
      }

script:
  # Segurança: se algo travar (rede lenta, servidor fora do ar), dorme mesmo assim.
  - id: vigia
    mode: restart
    then:
      - delay: 150s
      - if:
          condition:
            lambda: "return !id(modo_config);"
          then:
            - logger.log:
                level: WARN
                format: "Acordado há muito tempo; voltando a dormir"
            - script.execute:
                id: dormir
                falhou: true

  # O modo de configuração termina sozinho (para não gastar a bateria).
  - id: vigia_config
    mode: restart
    then:
      - delay: 15min
      - lambda: "id(modo_config) = false;"
      - deep_sleep.allow: sono
      - script.execute:
          id: dormir
          falhou: false

  # Por que acordou e o que fazer primeiro.
  - id: acordar
    then:
      - lambda: |-
          const auto causa = esp_sleep_get_wakeup_cause();
          id(pelo_relogio) = causa == ESP_SLEEP_WAKEUP_TIMER;
          // Botão ou ligado agora (não foi o relógio): atualiza a tela de qualquer jeito.
          id(atualizar_tela) = !id(pelo_relogio);
          ESP_LOGI("panelai", "Acordou: %s", id(pelo_relogio) ? "horário" : (causa == ESP_SLEEP_WAKEUP_UNDEFINED ? "ligado" : "botão"));
      - if:
          condition:
            lambda: "return !panelai::endereco_valido(id(endereco).state);"
          then:
            - if:
                condition:
                  lambda: "return id(pelo_relogio);"
                then:
                  # Sem endereço e ninguém por perto: dorme e confere de novo mais tarde.
                  - script.execute:
                      id: dormir
                      falhou: false
                else:
                  - lambda: "id(motivo_config) = 0;"
                  - script.execute: configurar
          else:
            - script.execute: conectar

  # Conecta no Wi-Fi; sem rede, decide entre tentar mais tarde e pedir configuração.
  - id: conectar
    then:
      - wait_until:
          condition: wifi.connected
          timeout: 40s
      - if:
          condition:
            not: wifi.connected
          then:
            - logger.log:
                level: WARN
                format: "Sem Wi-Fi"
            - text_sensor.template.publish:
                id: situacao
                state: "Sem Wi-Fi"
            - if:
                condition:
                  lambda: "return id(pelo_relogio);"
                then:
                  - lambda: |-
                      // O relógio interno (que segue andando durante o sono) decide se era a hora.
                      if (panelai::chegou_a_hora((uint32_t) ::time(nullptr), id(alvo))) id(atualizar_tela) = true;
                  - script.execute:
                      id: dormir
                      falhou: true
                else:
                  # Alguém apertou o botão ou ligou o aparelho: deixa escolher outra rede.
                  - lambda: "id(motivo_config) = 1;"
                  - script.execute: configurar
          else:
            - script.execute: online

  # Com internet: acerta o relógio, relê os horários e, se for a hora, baixa a imagem.
  - id: online
    then:
      - wait_until:
          condition:
            time.has_time:
              id: relogio
          timeout: 20s
      - http_request.get:
          url: !lambda 'return panelai::limpar_endereco(id(endereco).state) + "/config.json";'
          capture_response: true
          max_response_buffer_size: 4kB
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("panelai", "config.json: HTTP %d", response->status_code);
                    return;
                  }
                  const bool ok = json::parse_json(body, [](JsonObject raiz) -> bool {
                    JsonArray lista = raiz["proximas"].as<JsonArray>();
                    if (lista.isNull()) return false;
                    auto &prox = id(proximas);
                    prox.fill(0);
                    size_t i = 0;
                    for (JsonVariant v : lista) {
                      if (i >= prox.size()) break;
                      prox[i++] = v.as<uint32_t>();
                    }
                    return true;
                  });
                  if (!ok) ESP_LOGW("panelai", "config.json inválido; seguindo a agenda guardada");
          on_error:
            then:
              - logger.log:
                  level: WARN
                  format: "Não foi possível baixar o config.json; seguindo a agenda guardada"
      - lambda: |-
          // Com o relógio certo (internet): chegou a hora da atualização agendada?
          if (panelai::chegou_a_hora((uint32_t) ::time(nullptr), id(alvo))) id(atualizar_tela) = true;
      - if:
          condition:
            lambda: "return id(atualizar_tela);"
          then:
            # Baixa a imagem; ao terminar (on_download_finished / on_error) desenha e dorme.
            - online_image.set_url:
                id: tela_img
                url: !lambda 'return panelai::limpar_endereco(id(endereco).state) + "/tela.png";'
                update: true
          else:
            - script.execute:
                id: dormir
                falhou: false

  # Fica acordado mostrando as instruções na tela (e cria a rede "PanelAI-Tela" se não houver Wi-Fi).
  - id: configurar
    mode: single
    then:
      - lambda: "id(modo_config) = true;"
      - deep_sleep.prevent: sono
      - script.stop: vigia
      - script.execute: vigia_config
      - text_sensor.template.publish:
          id: situacao
          state: "Modo de configuração: cole o endereço da imagem"
      - component.update: epaper
      # Quando o Wi-Fi conectar, redesenha com o endereço da página do aparelho.
      - wait_until:
          condition: wifi.connected
          timeout: 15min
      - if:
          condition:
            lambda: "return id(modo_config);"
          then:
            - delay: 3s
            - if:
                condition:
                  # Entrou só porque estava sem Wi-Fi e o endereço já existe: segue sozinho.
                  lambda: "return id(motivo_config) == 1 && panelai::endereco_valido(id(endereco).state);"
                then:
                  - script.execute: sair_da_configuracao
                else:
                  - wait_until:
                      condition:
                        lambda: "return !id(epaper).is_updating();"
                      timeout: 40s
                  - component.update: epaper

  # Endereço colado na página do aparelho.
  - id: endereco_mudou
    then:
      - if:
          condition:
            lambda: "return panelai::endereco_valido(id(endereco).state);"
          then:
            - text_sensor.template.publish:
                id: situacao
                state: "Endereço salvo; atualizando a tela"
            - if:
                condition:
                  lambda: "return id(modo_config);"
                then:
                  - script.execute: sair_da_configuracao
          else:
            - text_sensor.template.publish:
                id: situacao
                state: "Endereço inválido: copie de PanelAI → Configurações → Tela e-ink"

  # Sai do modo de configuração e atualiza a tela agora.
  - id: sair_da_configuracao
    then:
      - lambda: |-
          id(modo_config) = false;
          id(atualizar_tela) = true;
          id(pelo_relogio) = false;
      - deep_sleep.allow: sono
      - script.stop: vigia_config
      - script.execute: vigia
      - if:
          condition:
            lambda: "return panelai::endereco_valido(id(endereco).state);"
          then:
            - script.execute: conectar
          else:
            - text_sensor.template.publish:
                id: situacao
                state: "Falta o endereço da imagem"

  # Calcula até quando dormir (regras em panelai_tela.h) e dorme.
  - id: dormir
    mode: single
    parameters:
      falhou: bool
    then:
      - lambda: |-
          if (falhou) {
            if (id(falhas) < 10) id(falhas)++;
          } else {
            id(falhas) = 0;
          }
          const uint32_t agora = (uint32_t) ::time(nullptr);
          const auto s = panelai::calcular_soneca(agora, id(proximas), falhou, id(atualizar_tela), id(falhas));
          id(alvo) = s.alvo;
          id(soneca_ms) = s.segundos * 1000;
          ESP_LOGI("panelai", "Dormindo %" PRIu32 " min (próximo horário: %" PRIu32 ", falhas seguidas: %d)", s.segundos / 60, s.alvo, (int) id(falhas));
      - deep_sleep.enter:
          id: sono
          sleep_duration: !lambda "return id(soneca_ms);"
